<script src="/plugin/js/v3-table-data.js"></script>
<script src="/plugin/js/module-overview.js"></script>
<div class="ake-ui-directory" id="akeArchiveModule" data-ake-module="archive">
    <aside class="ake-ui-directory__sidebar" id="akeArchiveSidebar" data-i18n-aria-label="modules.archive.directory.title" aria-label="档案目录">

        <label class="ake-ui-directory__search" for="akeArchiveSearch">
            <span class="ake-ui-directory__search-icon" aria-hidden="true"></span>
            <input
                id="akeArchiveSearch"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="搜索档案名称或正文"
                aria-label="搜索档案名称或正文"
                data-i18n-placeholder="modules.archive.search.placeholder"
                data-i18n-aria-label="modules.archive.search.label"
            >
        </label>

        <div class="ake-ui-filter" id="akeArchiveFilterBar">
            <div class="ake-ui-filter__group">
                <span class="ake-ui-filter__label">地区</span>
                <div class="ake-ui-filter__options" id="akeArchiveRegionFilter" aria-label="地区筛选"></div>
            </div>
            <div class="ake-ui-filter__group">
                <span class="ake-ui-filter__label">档案类型</span>
                <div class="ake-ui-filter__options" id="akeArchiveTypeFilter" aria-label="档案类型筛选"></div>
            </div>
        </div>

        <nav
            class="ake-ui-directory__list"
            id="akeArchiveDirectory"
            aria-label="档案目录"
            data-i18n-aria-label="modules.archive.directory.title"
        ></nav>
    </aside>

    <main class="ake-ui-directory__content" id="akeArchiveContent" tabindex="-1">
        <div class="ake-ui-state" data-state="loading" data-layout="page" role="status">
            <div>
                <h2 data-i18n="modules.archive.title">档案库</h2>
                <p data-i18n="modules.archive.loading.archive">正在读取档案数据</p>
            </div>
        </div>
    </main>

    <button
        class="ake-ui-directory__mobile-button"
        id="akeArchiveMobileButton"
        type="button"
        aria-controls="akeArchiveMobileOverlay"
        aria-expanded="false"
        data-i18n="modules.archive.buttons.openDirectory"
    >档案目录</button>

    <div class="ake-ui-directory__mobile-overlay" id="akeArchiveMobileOverlay" aria-hidden="true">
        <section
            class="ake-ui-directory__mobile-panel"
            id="akeArchiveMobilePanel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="akeArchiveMobileTitle"
        >
            <header class="ake-ui-directory__mobile-header">
                <strong id="akeArchiveMobileTitle" data-i18n="modules.archive.directory.title">档案目录</strong>
                <button
                    class="ake-ui-icon-button"
                    id="akeArchiveMobileClose"
                    type="button"
                    aria-label="关闭"
                    title="关闭"
                    data-i18n-aria-label="modules.archive.buttons.close"
                    data-i18n-title="modules.archive.buttons.close"
                >&times;</button>
            </header>
            <label class="ake-ui-directory__search ake-ui-directory__search--mobile" for="akeArchiveMobileSearch">
                <span class="ake-ui-directory__search-icon" aria-hidden="true"></span>
                <input
                    id="akeArchiveMobileSearch"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="搜索档案名称或正文"
                    aria-label="搜索档案名称或正文"
                    data-i18n-placeholder="modules.archive.search.placeholder"
                    data-i18n-aria-label="modules.archive.search.label"
                >
            </label>
            <div class="ake-ui-filter" id="akeArchiveMobileFilterBar">
                <div class="ake-ui-filter__group">
                    <span class="ake-ui-filter__label">地区</span>
                    <div class="ake-ui-filter__options" id="akeArchiveMobileRegionFilter" aria-label="地区筛选"></div>
                </div>
                <div class="ake-ui-filter__group">
                    <span class="ake-ui-filter__label">档案类型</span>
                    <div class="ake-ui-filter__options" id="akeArchiveMobileTypeFilter" aria-label="档案类型筛选"></div>
                </div>
            </div>
            <nav
                class="ake-ui-directory__mobile-list"
                id="akeArchiveMobileDirectory"
                aria-label="移动端档案目录"
                data-i18n-aria-label="modules.archive.directory.title"
            ></nav>
        </section>
    </div>
</div>

<script src="/plugin/js/ake-voice-player.js"></script>
<script src="/plugin/js/v3-archive.js"></script>
