<div class="ake-ui-directory" data-ake-module="akegf">
    <aside class="ake-ui-directory__sidebar">
        <nav class="ake-ui-directory__list" data-pages></nav>
    </aside>
    <main class="ake-ui-directory__content">
        <article class="research-article">
            <div class="article-content" data-document></div>
            <div data-downloads hidden>
                <a class="ake-ui-button" download data-download="akegf-v0.3.schema.json" data-i18n="modules.akegf.schema"></a>
                <a class="ake-ui-button" download data-download="example.json" data-i18n="modules.akegf.example"></a>
            </div>
            <form hidden>
                <label><span data-i18n="modules.akegf.fileInput"></span>
                    <input type="file" accept=".json,application/json">
                </label>
                <label><span data-i18n="modules.akegf.input"></span>
                    <textarea rows="12" spellcheck="false"></textarea>
                </label>
                <button class="ake-ui-button" type="submit" data-i18n="modules.akegf.check"></button>
                <output aria-live="polite"></output>
            </form>
        </article>
    </main>
    <button type="button" class="ake-ui-directory__mobile-button" aria-expanded="false" aria-controls="akegf-pages" data-i18n="modules.akegf.sections"></button>
    <div id="akegf-pages" class="ake-ui-directory__mobile-overlay" aria-hidden="true">
        <section class="ake-ui-directory__mobile-panel">
            <header class="ake-ui-directory__mobile-header">
                <span data-i18n="modules.akegf.sections"></span>
                <button type="button" data-close data-i18n="modules.akegf.close"></button>
            </header>
            <nav class="ake-ui-directory__mobile-list" data-pages></nav>
        </section>
    </div>
</div>
<script src="/plugin/js/vendor/ajv-dist-8.17.1/ajv2020.min.js"></script>
<script src="/plugin/js/akegf.js"></script>
