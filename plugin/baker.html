<script src="/plugin/js/v3-table-data.js"></script>
<script src="/plugin/js/module-overview.js"></script>
<div class="ake-ui-directory" id="bakerModule" data-ake-module="baker">
    <aside class="ake-ui-directory__sidebar" id="bakerSidebar">
        <header class="ake-ui-directory__sidebar-header">
            <div>
                <h1>Baker</h1>
                <small id="bakerContactSummary" data-i18n="modules.baker.loadingContacts">正在读取联系人</small>
            </div>
        </header>
        <label class="ake-ui-directory__search">
            <span class="ake-ui-directory__search-icon" aria-hidden="true"></span>
            <input id="bakerSearchInput" type="search" autocomplete="off" data-i18n-placeholder="modules.baker.search" placeholder="搜索联系人、群聊或消息">
        </label>
        <div class="ake-ui-filter" id="bakerFilterBar">
            <div class="ake-ui-filter__group">
                <div class="ake-ui-filter__options" id="bakerTypeFilter" role="group" aria-label="会话类型">
                    <button type="button" class="ake-ui-filter__button is-active" data-baker-type="all" aria-pressed="true" data-i18n="common.all">全部</button>
                    <button type="button" class="ake-ui-filter__button" data-baker-type="3" aria-pressed="false" data-i18n="modules.baker.operators">干员</button>
                    <button type="button" class="ake-ui-filter__button" data-baker-type="1" aria-pressed="false" data-i18n="modules.baker.contacts">联系人</button>
                    <button type="button" class="ake-ui-filter__button" data-baker-type="2" aria-pressed="false" data-i18n="modules.baker.groups">群聊</button>
                </div>
            </div>
        </div>
        <div class="ake-ui-directory__list" id="bakerContactList"></div>
    </aside>
    <main class="ake-ui-directory__content" id="bakerConversation">
        <div class="ake-ui-state" data-state="loading" data-layout="page"><b data-i18n="modules.baker.loading">正在建立 Baker 会话索引</b></div>
    </main>
    <button class="ake-ui-directory__mobile-button" id="bakerMobileButton" type="button" aria-label="打开联系人列表" data-i18n="modules.baker.contacts">联系人</button>
    <button class="ake-ui-directory__mobile-overlay" id="bakerMobileBackdrop" type="button" aria-label="关闭联系人列表"></button>
</div>
<script src="/plugin/js/baker.js"></script>
