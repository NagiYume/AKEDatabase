map "$request_method:$uri" $akegf_method_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    ~^(POST|DELETE):/admin/v1/ 1;
}

limit_req_zone $binary_remote_addr zone=akegf_admin_requests:1m rate=3r/s;

server {
    listen 443 ssl;
    server_name verify.akedata.wiki;
    ssl_certificate /etc/akegf-verify/acme/certs/verify.akedata.wiki_ecc/fullchain.cer;
    ssl_certificate_key /etc/akegf-verify/acme/certs/verify.akedata.wiki_ecc/verify.akedata.wiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    root /var/lib/akegf-verify;
    open_file_cache off;
    types { }
    default_type application/json;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 = @missing;

    if ($akegf_method_allowed = 0) {
        return 405;
    }

    location = / {
        index index.html;
    }
    location = /index.html {
        default_type text/html;
        charset utf-8;
        try_files $uri =404;
    }
    location = /directory.css {
        default_type text/css;
        alias /opt/akegf-verify/web/directory.css;
    }
    location = /v1/providers.json {
        try_files $uri =404;
    }
    location = /healthz {
        return 200 '{"status":"ok"}';
    }
    location = /admin {
        default_type text/html;
        charset utf-8;
        alias /opt/akegf-verify/web/admin.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location = /admin/ {
        add_header Cache-Control "no-store" always;
        return 308 /admin;
    }
    location ~ ^/admin/(?<akegf_admin_asset>admin\.(?:js|css))$ {
        types {
            application/javascript js;
            text/css css;
        }
        alias /opt/akegf-verify/web/$akegf_admin_asset;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /admin/v1/ {
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        client_body_timeout 10s;
        limit_req zone=akegf_admin_requests burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8768;
        proxy_connect_timeout 3s;
        proxy_read_timeout 55s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
    location ~ "^/v1/providers/[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?/keys/[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]\.json$" {
        try_files $uri =404;
    }
    location @missing {
        return 404 '{"error":"not_found"}';
    }
    location / {
        return 404;
    }
}
