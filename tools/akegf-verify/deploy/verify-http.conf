server {
    listen 80;
    server_name verify.akedata.wiki;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ake-acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://verify.akedata.wiki$request_uri;
    }
}
